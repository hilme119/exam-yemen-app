<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="منصة الاختبارات اليمنية للاختبارات الوزارية واختبارات القبول الجامعية. تدرب على نماذج الامتحانات السابقة واكتشف مستواك فوراً للشهادة الثانوية والجامعة.">
  <meta name="keywords" content="منصة الاختبارات اليمنية, اختبارات وزارية, اختبارات القبول الجامعية, اختبارات قبول جامعة صنعاء, اليمن, ثالث ثانوي, نماذج امتحانات, وزارة التربية والتعليم, الجامعات اليمنية, منصة الاختبارات">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="منصة الاختبارات اليمنية">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>منصة الاختبارات اليمنية | للاختبارات الوزارية واختبارات القبول الجامعية</title>
  
  <!-- Open Graph for Facebook/WhatsApp sharing -->
  <meta property="og:title" content="منصة الاختبارات اليمنية | للاختبارات الوزارية والقبول الجامعي" />
  <meta property="og:description" content="أفضل منصة يمنية للتدريب على نماذج الاختبارات الوزارية واختبارات القبول الجامعية." />
  <link rel="manifest" href="manifest.json">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1A1A2E; /* App background color */
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
    }
    
    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(100, 255, 218, 0.2); /* Teal accent */
      border-radius: 50%;
      border-top-color: #64ffda;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 24px;
    }

    .pulse-text {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #64ffda;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading-indicator">
    <div class="spinner"></div>
    <div class="pulse-text">جاري تجهيز المنصة...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Fade out the loading indicator when Flutter starts
    window.addEventListener('flutter-first-frame', function() {
      var loadingIndicator = document.getElementById('loading-indicator');
      if (loadingIndicator) {
        loadingIndicator.style.transition = 'opacity 0.5s ease-out';
        loadingIndicator.style.opacity = '0';
        setTimeout(function() {
          loadingIndicator.remove();
        }, 500);
      }
    });
  </script>
</body>
</html>
